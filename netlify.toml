# Netlify Configuration for SET Polytechnic Timetable PWA

[build]
  command = "npm run build"
  publish = "dist"

# Single Page Application & PWA Routing Redirects
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security & Base Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Service Worker - Strict No-Cache (Ensures instant PWA cache updates across all devices)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
    Content-Type = "application/javascript; charset=utf-8"

# Web App Manifest
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "no-cache, no-store, must-revalidate"

# Production Built Assets (Hashed) - Long Term Immutable Cache
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
