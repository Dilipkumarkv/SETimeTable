<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="100" fill="#2563eb"/>
  <rect x="76" y="86" width="360" height="340" rx="28" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="14"/>
  <!-- Calendar header band -->
  <rect x="76" y="86" width="360" height="80" rx="28" fill="#ffffff"/>
  <rect x="76" y="138" width="360" height="28" fill="#ffffff"/>
  <!-- Calendar hanging rings -->
  <rect x="146" y="60" width="24" height="52" rx="12" fill="#ffffff"/>
  <rect x="342" y="60" width="24" height="52" rx="12" fill="#ffffff"/>
  <!-- Timetable Grid & Clock Accent -->
  <circle cx="256" cy="300" r="90" fill="#1e40af" stroke="#ffffff" stroke-width="12"/>
  <!-- Clock hands at 09:45 (Start of P1) -->
  <line x1="256" y1="300" x2="196" y2="300" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <line x1="256" y1="300" x2="256" y2="240" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <circle cx="256" cy="300" r="10" fill="#ffffff"/>
  <!-- Subtitle Text -->
  <text x="256" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#1e40af" text-anchor="middle" letter-spacing="3">TIMETABLE</text>
  <!-- Mini badges -->
  <rect x="106" y="196" width="60" height="20" rx="4" fill="#60a5fa"/>
  <rect x="346" y="196" width="60" height="20" rx="4" fill="#60a5fa"/>
</svg>
